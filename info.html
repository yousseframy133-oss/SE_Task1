<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Information</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .roster-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .roster-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.25rem 1.5rem;
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .roster-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #f1f5f9;
        }

        .id-badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.4rem 0.85rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            .roster-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .id-badge {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h1>Student Roster</h1>
            <p>Assigned Group Members & Identification Numbers</p>
        </div>

        <div class="roster-list">
            <!-- Row 1 -->
            <div class="roster-item">
                <div class="student-info">
                    <div class="avatar-badge">1</div>
                    <span class="name">Youssef Ramy Hassan</span>
                </div>
                <div class="id-badge">ID: 20240689</div>
            </div>

            <!-- Row 2 -->
            <div class="roster-item">
                <div class="student-info">
                    <div class="avatar-badge">2</div>
                    <span class="name">Ahmed Farag Fathy</span>
                </div>
                <div class="id-badge">ID: 20242019</div>
            </div>
        </div>
    </div>

</body>
</html>
